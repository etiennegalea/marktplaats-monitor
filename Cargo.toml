[package]
name = "marktplaats-monitor"
version = "0.1.0"
edition = "2024"
description = "Cross-platform desktop monitor for Marktplaats listings"
license = "MIT"

[[bin]]
name = "marktplaats-monitor"
path = "rust-src/main.rs"

[dependencies]
chrono = "0.4"
directories = "6"
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "links", "wayland", "wgpu", "x11"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
rand = "0.10"
rayon = "1.11"
reqwest = { version = "0.13", features = ["blocking", "json", "query"] }
rfd = "0.17"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
lto = "thin"
strip = true
